clusters:
  - url: https://cluster-api-1.example.com:8006/api2/json
    insecure: false
    token_id: "user!token-id"
    token_secret: "secret"
    region: cluster-1
    enable_zfs_snapshots: true
    ssh_user: root
    ssh_port: 22
    ssh_private_key_secret_ref:
      namespace: proxmox-csi
      name: proxmox-node-ssh
      key: id_rsa
    node_host_map:
      pve-node-1: 10.0.0.11
      pve-node-2: pve-node-2.example.com
  - url: https://cluster-api-2.example.com:8006/api2/json
    insecure: false
    token_id: "user!token-id"
    token_secret: "secret"
    region: cluster-2
