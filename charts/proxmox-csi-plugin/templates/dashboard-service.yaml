{{- if .Values.dashboard.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "proxmox-csi-plugin.fullname" . }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "proxmox-csi-plugin.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: dashboard
      protocol: TCP
      name: http
  selector:
    {{- include "proxmox-csi-plugin.selectorLabels" . | nindent 4 }}
{{- end }}
