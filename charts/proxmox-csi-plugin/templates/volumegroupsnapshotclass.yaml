{{- range $volumeGroupSnapshot := .Values.volumeGroupSnapshotClass }}
apiVersion: groupsnapshot.storage.k8s.io/v1beta2
kind: VolumeGroupSnapshotClass
metadata:
  name: {{ $volumeGroupSnapshot.name | required "VolumeGroupSnapshotClass name must be provided." }}
  {{- with $volumeGroupSnapshot.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $volumeGroupSnapshot.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
driver: {{ $.Values.provisionerName }}
deletionPolicy: {{ default "Delete" $volumeGroupSnapshot.deletionPolicy }}
parameters:
  {{- mustMergeOverwrite (default (dict) $volumeGroupSnapshot.extraParameters) (include "volumeGroupSnapshotClass.parameters" . | fromYaml) | toYaml | nindent 2 -}}
---
{{- end }}
