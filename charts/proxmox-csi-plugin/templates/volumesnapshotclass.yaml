{{- range $volumeSnapshot := .Values.volumeSnapshotClass }}
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: {{ $volumeSnapshot.name | required "VolumeSnapshotClass name must be provided." }}
  {{- with $volumeSnapshot.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $volumeSnapshot.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
driver: {{ $.Values.provisionerName }}
deletionPolicy: {{ default "Delete" $volumeSnapshot.deletionPolicy }}
parameters:
  {{- mustMergeOverwrite (default (dict) $volumeSnapshot.extraParameters) (include "volumeSnapshotClass.parameters" . | fromYaml) | toYaml | nindent 2 -}}
---
{{- end }}
